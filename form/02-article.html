<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Article - Techium</title>
    <meta name="description" content="Description of the page less than 150 characters">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Raleway:700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="00-styles.css">
  </head>
  <body>
    <!– Header –>
    <header class="header" data-section-theme="dark">
      <div class="container">
        <div class="header-container">
          <div class="header-logo">
            <a href="/">
              <img src="images/logo-white.png" alt="Techium logo" width="160" height="40">
            </a>
          </div>
          <nav class="navbar-menu">
            <ul class="nav">
              <li class="nav-item">
                <a href="/" class="nav-link">Home</a>
              </li>
              <li class="nav-item">
                <a href="#services" class="nav-link">Services</a>
              </li>
              <li class="nav-item">
                <a href="#works" class="nav-link">Works</a>
              </li>
              <li class="nav-item">
                <a href="#about" class="nav-link">About</a>
              </li>
              <li class="nav-item">
                <a href="#latest_news" class="nav-link">Latest news</a>
              </li>
              <li class="nav-item">
                <a href="#testimonials" class="nav-link">Testimonials</a>
              </li>
              <li class="nav-item">
                <a href="#contact" class="nav-link">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <!– Main –>
    <main>
            <!-- Hero section -->
            <header class="section-hero hero-article" data-section-theme="dark" style="background-image: url('images/pic-article-02.jpg')">
                <div class="container">
                    <div class="section-body">
                        <section class="section-inner">
                            <span class="section-category">Digital Life</span>
                            <h1 class="section-title">Ut alios omittam, hunc appello, quem ille unum secutus est.</h1>
                        </section>
                    </div>
                </div>
            </header>
        
            <div class="main-article">
                <div class="container">
                    <div class="post">
                        <article class="post-content">
                            <!-- Your article content here -->
                        </article>
                    </div>
                </div>
            </div>
        
            <!-- New section for comments as a sibling to the post div -->
            <div class="post-comments">
                <!-- Header inside the post-comments section -->
                <header>
                    <h2 class="section-title">Leave a comment</h2>
                    <p>All fields are required.</p>
                </header>
        
                <!-- Form inside the post-comments section -->
                <form action="#" method="post">
                    <!-- First fieldset for personal information -->
                    <fieldset class="visually-hidden">
                        <legend>Your personal information</legend>
                        <div class="form-group col-1-2">
                            <label for="comment-name">Name:</label>
                            <input type="text" id="comment-name" name="name" required>
                        </div>
                        <div class="form-group col-1-2">
                            <label for="comment-email">Email:</label>
                            <input type="email" id="comment-email" name="email" required>
                        </div>
                        <div class="form-group col-2-3">
                            <label for="comment-phone">Phone:</label>
                            <input type="tel" id="comment-phone" name="phone">
                        </div>
                    </fieldset>
        
                    <!-- Second fieldset for the comment -->
                    <fieldset class="visually-hidden">
                        <legend>Your comment</legend>
                        <div class="form-group col-2-3">
                            <label for="comment-message">Comment:</label>
                            <textarea id="comment-message" name="comment" rows="4" required></textarea>
                        </div>
                        <div class="form-group col-2-3">
                            <label for="comment-rating">Rating (1 to 5):</label>
                            <input type="number" id="comment-rating" name="rating" min="1" max="5" required>
                        </div>
                        <div class="form-group">
                            <button type="submit">Submit Comment</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        
            <!-- Footer -->
            <footer class="footer" data-section-theme="dark">
                <div class="container">
                    <div class="row">
                        <div class="col-1-2">
                            <img src="images/logo-white.png" alt="Techium logo" width="160" height="40">
                            <address class="footer-address">
                                234 Washington Street<br>
                                Urbana, Illinois
                            </address>
                        </div>
                        <div class="col-1-2">
                            <ul class="social nav">
                                <li class="social-item nav-item">
                                    <a href="https://www.facebook.com/HolbertonSchool/" class="social-link">
                                        <!-- Facebook SVG icon here -->
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </footer>
        </main>
