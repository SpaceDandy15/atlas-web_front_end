<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <script>
        // Function to add a post row
        function addPostRow(data) {
            // Append the paragraph with the post details
            $('body').append(
                `<p><span>Post created with id ${data.id}, title: ${data.title}, author: ${data.author}</span></p>`
            );
        }

        // Function to list posts by querying the local json-server
        function listPosts() {
            $.get("http://localhost:3000/posts", function(response) {
                // Iterate through each post and call addPostRow
                response.forEach(function(post) {
                    addPostRow(post);
                });
            }).fail(function() {
                // If the server fails, display an alert
                alert("Server Error");
            });
        }

        // Call listPosts when the page loads
        $(document).ready(function() {
            listPosts();
        });
    </script>

</body>
</html>
